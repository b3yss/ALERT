<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алерт — Браузерная 2D игра</title>
    <style>
        :root { --bg: #0a0a0a; --text: #c7c7c7; --accent: #b30000; --accent2: #ff1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', 'Consolas', monospace; user-select: none; -webkit-user-select: none; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid #1a1a1a; box-shadow: 0 0 40px rgba(180,0,0,0.25), 0 0 80px rgba(0,0,0,0.8); cursor: none; }
    </style>
</head>
<body>
<div id="gameContainer"><canvas id="gameCanvas"></canvas></div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const VIRTUAL_WIDTH = 1280, VIRTUAL_HEIGHT = 720;
        const ARENA_WIDTH = 1400, ARENA_HEIGHT = 1000;
        const CORRIDOR_WIDTH = 3000, CORRIDOR_HEIGHT = 280;
        const PLAYER_SPEED = 440, PLAYER_HP_MAX = 200;
        const KEY_COOLDOWN = 0.35, RELOAD_TIME = 0.6, STICK_COOLDOWN = 0.2, STICK_RANGE = 120, STICK_DAMAGE = 70;
        const DEAGLE_DAMAGE = 100, BULLET_SPEED = 1800;
        const CASING_DAMAGE_INTERVAL = 1.0, CASING_THRESHOLD_5 = 5, CASING_THRESHOLD_10 = 10;
        const MADNESS_DECAY_DELAY = 10.0, MADNESS_DECAY_RATE = 25;
        const MULTIKILL_WINDOW = 1.5, MULTIKILL_BONUS = 400, CRIT_CHANCE = 0.4, CRIT_BONUS = 600;
        const WAVE_PAUSE = 3.0, BOSS_INTERVAL = 10, BOSS_HP_BASE = 150, BOSS_HP_SCALE = 100;
        const DASH_DISTANCE = 320, DASH_COOLDOWN = 1.0, DASH_SELF_DAMAGE = 10, DASH_ENEMY_DAMAGE = 80;
        const ENEMY_STUN_DURATION = 1.2, JITTER_INTENSITY_5 = 1.2, JITTER_INTENSITY_10 = 3;
        const DASH_MISS_STUN = 0.3;
        const EYE_THROW_SPEED = 1800, EYE_STUN_DURATION = 3.6, EYE_DROP_CHANCE = 0.7;
        const ORGAN_GROUND_TIME = 120;
        const FIRE_LIFETIME = 16;
        const FIRE_DAMAGE_INTERVAL = 0.5;
        const TURRET_DETECT_RANGE = 175;

        function getMadnessLevel(score) {
            if (score < 15000) return { name: 'Садист', level: 0 };
            if (score < 40000) return { name: 'Хитман', level: 1 };
            if (score < 100000) return { name: 'Киллер', level: 2 };
            return { name: 'АБСОЛЬТНЫЙ МОНСТР', level: 3 };
        }

        let adState = null, lastMadnessLevel = 0;
        const adImageUp = new Image(); adImageUp.src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOTLcskIJU1IbFHPE7zHU24h580TrHyVXqFQ&s';
        const adImageDown = new Image(); adImageDown.src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSB3n8ffMEh5KzKRvDsfsdFiHGoPD_xaS1Ylg&s';
        function triggerAd(type) { adState = { type, timer:0, image: type==='up'?adImageUp:adImageDown, x:-400, y:VIRTUAL_HEIGHT-200, alpha:0, duration:6 }; }

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==='suspended') audioCtx.resume(); }
        function playBeep(f,d,t='square',v=0.08,fo=true) { if(!audioCtx)return; try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);if(fo)g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){} }
        function sfxShoot(){playBeep(80,0.1,'square',0.15);playBeep(40,0.15,'sawtooth',0.1)}
        function sfxReload(){playBeep(200,0.08,'triangle',0.06);playBeep(150,0.12,'square',0.05)}
        function sfxStick(){playBeep(300,0.15,'sine',0.07);playBeep(100,0.1,'triangle',0.04)}
        function sfxEnemyDeath(){playBeep(60,0.2,'sawtooth',0.1);playBeep(30,0.3,'square',0.08)}
        function sfxShakeLeg(){playBeep(120,0.3,'triangle',0.05);playBeep(90,0.4,'sine',0.04)}
        function sfxHit(){playBeep(50,0.08,'square',0.12)}
        function sfxBossAppear(){playBeep(40,0.5,'sawtooth',0.15);playBeep(25,0.6,'square',0.12)}
        function sfxDash(){playBeep(70,0.25,'sawtooth',0.2);playBeep(30,0.3,'square',0.15)}
        function sfxParalysis(){playBeep(150,0.4,'sawtooth',0.1);playBeep(80,0.5,'square',0.08)}
        function sfxAngelHeal(){ playBeep(523,0.3,'sine',0.1); playBeep(659,0.4,'sine',0.1); playBeep(784,0.5,'sine',0.12); playBeep(1047,0.6,'sine',0.1); }
        function sfxExplosion(){ playBeep(40,0.4,'sawtooth',0.3); playBeep(20,0.6,'square',0.25); }
        function sfxBurnScream(){ playBeep(200,0.2,'sawtooth',0.1); playBeep(150,0.3,'square',0.08); }

        const STATE = { MENU:'menu', HOWTO:'howto', CORRIDOR:'corridor', PLAYING:'playing', DEAD:'dead' };
        let gameState = STATE.MENU, paused = false, layoutWarning = 0, difficulty = 'medium';
        let diffSet = {
            easy:{ enemyHpMul:0.7, enemySpdMul:0.8, spawnMul:0.6, waveAdd:0.7 },
            medium:{ enemyHpMul:1.0, enemySpdMul:1.0, spawnMul:1.0, waveAdd:1.0 },
            hard:{ enemyHpMul:1.4, enemySpdMul:1.25, spawnMul:1.4, waveAdd:1.3 },
            insane:{ enemyHpMul:2.0, enemySpdMul:1.6, spawnMul:2.0, waveAdd:1.7 }
        };

        let highScores = { easy:{score:0,wave:0}, medium:{score:0,wave:0}, hard:{score:0,wave:0}, insane:{score:0,wave:0} };
        try {
            const saved = localStorage.getItem('alert_highscores');
            if (saved) { const parsed = JSON.parse(saved); for (const diff of Object.keys(highScores)) if (parsed[diff]) highScores[diff] = parsed[diff]; }
        } catch(e) {}

        const keys = {};
        let mouseX = VIRTUAL_WIDTH/2, mouseY = VIRTUAL_HEIGHT/2, mouseOnCanvas = false;
        let mouseLeftDown = false, mouseRightDown = false, mouseWheelDelta = 0;
        let canvasRect = null;
        function updateCanvasRect(){ canvasRect = canvas.getBoundingClientRect(); }
        function getCanvasMouse(e){ if(!canvasRect) updateCanvasRect(); const sx=VIRTUAL_WIDTH/canvasRect.width, sy=VIRTUAL_HEIGHT/canvasRect.height; return { x:(e.clientX-canvasRect.left)*sx, y:(e.clientY-canvasRect.top)*sy }; }
        document.addEventListener('keydown', e=>{
            keys[e.key.toLowerCase()] = true; keys[e.code] = true;
            if (e.key === 'Escape') { if (gameState === STATE.PLAYING || gameState === STATE.CORRIDOR) paused = !paused; e.preventDefault(); }
            if (['k','r','1','2','shift','e','g'].includes(e.key.toLowerCase()) || e.key === 'Shift') e.preventDefault();
            if (/[а-яё]/i.test(e.key)) layoutWarning = 2.5;
        });
        document.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; keys[e.code]=false; });
        canvas.addEventListener('mousemove', e=>{ const m=getCanvasMouse(e); mouseX=m.x; mouseY=m.y; mouseOnCanvas=true; });
        canvas.addEventListener('mouseleave', ()=>mouseOnCanvas=false);
        canvas.addEventListener('mousedown', e=>{ initAudio(); if(e.button===0)mouseLeftDown=true; if(e.button===2)mouseRightDown=true; e.preventDefault(); });
        canvas.addEventListener('mouseup', e=>{ if(e.button===0)mouseLeftDown=false; if(e.button===2)mouseRightDown=false; });
        canvas.addEventListener('wheel', e=>{ mouseWheelDelta+=e.deltaY; e.preventDefault(); });
        canvas.addEventListener('contextmenu', e=>e.preventDefault());
        window.addEventListener('resize', ()=>{ resizeCanvas(); updateCanvasRect(); });
        function resizeCanvas(){
            const mW=window.innerWidth, mH=window.innerHeight, r=VIRTUAL_WIDTH/VIRTUAL_HEIGHT;
            let w,h; if(mW/mH>r){ h=mH; w=h*r; } else { w=mW; h=w/r; }
            canvas.style.width=w+'px'; canvas.style.height=h+'px';
            canvas.width=VIRTUAL_WIDTH; canvas.height=VIRTUAL_HEIGHT; updateCanvasRect();
        }
        resizeCanvas();

        let camera = { x:0, y:0, targetX:0, targetY:0 }, healFlashTimer = 0;
        function updateCam(px,py,wW,wH,dt){
            camera.targetX=px-VIRTUAL_WIDTH/2; camera.targetY=py-VIRTUAL_HEIGHT/2;
            camera.targetX=Math.max(0,Math.min(camera.targetX,wW-VIRTUAL_WIDTH));
            camera.targetY=Math.max(0,Math.min(camera.targetY,wH-VIRTUAL_HEIGHT));
            if(wW<=VIRTUAL_WIDTH)camera.targetX=(wW-VIRTUAL_WIDTH)/2;
            if(wH<=VIRTUAL_HEIGHT)camera.targetY=(wH-VIRTUAL_HEIGHT)/2;
            const lerp=8; camera.x+=(camera.targetX-camera.x)*Math.min(1,lerp*dt); camera.y+=(camera.targetY-camera.y)*Math.min(1,lerp*dt);
        }
        function screenToWorld(sx,sy){ return { x:sx+camera.x, y:sy+camera.y }; }

        class Fire {
            constructor(x,y){ this.x=x; this.y=y; this.radius=20+Math.random()*10; this.life=FIRE_LIFETIME; }
            update(dt){ this.life -= dt; return this.life>0; }
            draw(ctx,cx,cy){
                const sx=this.x-cx, sy=this.y-cy; const a = Math.min(1, this.life/2);
                ctx.globalAlpha = a*0.8; ctx.fillStyle = '#ff6600'; ctx.beginPath(); ctx.ellipse(sx, sy, this.radius*0.8, this.radius, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.ellipse(sx, sy-2, this.radius*0.5, this.radius*0.6, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
            }
        }
        class BloodStain {
            constructor(x,y,r){ this.x=x; this.y=y; this.radius=r||5+Math.random()*12; this.alpha=0.7+Math.random()*0.3; this.life=15+Math.random()*20; this.maxLife=this.life; }
            update(dt){ this.life-=dt; return this.life>0; }
            draw(ctx,cx,cy){ const a=Math.max(0,this.life/this.maxLife)*this.alpha; const sx=this.x-cx,sy=this.y-cy; ctx.fillStyle=`rgba(120,0,0,${a})`; ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,Math.PI*2); ctx.fill(); ctx.fillStyle=`rgba(60,0,0,${a*0.8})`; ctx.beginPath(); ctx.arc(sx+1,sy-1,this.radius*0.7,0,Math.PI*2); ctx.fill(); }
        }
        class Organ {
            constructor(x,y,type){ this.x=x; this.y=y; this.type=type; this.radius=type==='brain'?6:4; this.life=ORGAN_GROUND_TIME; this.color=type==='brain'?'#ff8888':'#ffffff'; }
            update(dt){ this.life-=dt; return this.life>0; }
            draw(ctx,cx,cy){ if(this.life<=0)return; const sx=this.x-cx,sy=this.y-cy; const a=Math.min(1,this.life/5); ctx.globalAlpha=a; if(this.type==='brain'){ ctx.fillStyle=this.color; ctx.beginPath(); ctx.ellipse(sx,sy,this.radius,this.radius*0.9,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#cc6666'; ctx.beginPath(); ctx.ellipse(sx-2,sy-1,2,2,0,0,Math.PI*2); ctx.fill(); } else { ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#000000'; ctx.beginPath(); ctx.arc(sx,sy,this.radius-3,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(sx-1,sy-1,1,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
        }
        class ThrownEye {
            constructor(x,y,angle){ this.x=x; this.y=y; this.angle=angle; this.speed=EYE_THROW_SPEED; this.radius=4; this.alive=true; }
            update(dt,wW,wH){ this.x+=Math.cos(this.angle)*this.speed*dt; this.y+=Math.sin(this.angle)*this.speed*dt; if(this.x<-50||this.x>wW+50||this.y<-50||this.y>wH+50)this.alive=false; }
            draw(ctx,cx,cy){ if(!this.alive)return; const sx=this.x-cx,sy=this.y-cy; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#000000'; ctx.beginPath(); ctx.arc(sx,sy,this.radius-3,0,Math.PI*2); ctx.fill(); }
        }

        class Player {
            constructor(x,y){
                this.x=x; this.y=y; this.w=28; this.h=32; this.hp=PLAYER_HP_MAX; this.maxHp=PLAYER_HP_MAX;
                this.speed=PLAYER_SPEED; this.angle=0; this.currentWeapon='stick'; this.stickCooldown=0;
                this.deagleLoaded=true; this.deagleReloading=false; this.deagleReloadTimer=0;
                this.casingsInShoe=0; this.casingDamageTimer=0; this.isShakingLeg=false; this.shakeLegTimer=0;
                this.madnessPoints=0; this.madnessMultiplier=1; this.madnessMultiplierTimer=0;
                this.killsInWindow=0; this.multikillWindowTimer=0; this.noDamageTimer=0; this.styleText=''; this.styleTimer=0;
                this.dashCooldownTimer=0; this.isDashing=false; this.dashTimer=0; this.dashAngle=0;
                this.jx=0; this.jy=0; this.jt=0; this.stunTimer=0; this.dashHitEnemy=false;
                this.eyes=0; this.isMoving=false; this.moveAnimTimer=0; this.fireDamageTimer=0;
            }
            reset(x,y){ this.x=x; this.y=y; this.hp=this.maxHp; this.angle=0; this.currentWeapon='stick'; this.stickCooldown=0; this.deagleLoaded=true; this.deagleReloading=false; this.deagleReloadTimer=0; this.casingsInShoe=0; this.casingDamageTimer=0; this.isShakingLeg=false; this.shakeLegTimer=0; this.madnessPoints=0; this.madnessMultiplier=1; this.madnessMultiplierTimer=0; this.killsInWindow=0; this.multikillWindowTimer=0; this.noDamageTimer=0; this.styleText=''; this.styleTimer=0; this.dashCooldownTimer=0; this.isDashing=false; this.dashTimer=0; this.jx=0; this.jy=0; this.jt=0; this.stunTimer=0; this.dashHitEnemy=false; this.eyes=0; this.isMoving=false; this.moveAnimTimer=0; this.fireDamageTimer=0; }
            update(dt, wW, wH, bullets, particles, bloodStains, obstacles, thrownEyes, fires){
                if(this.casingsInShoe>CASING_THRESHOLD_5 && !this.isShakingLeg){ this.jt+=dt; const int=this.casingsInShoe>CASING_THRESHOLD_10?JITTER_INTENSITY_10:JITTER_INTENSITY_5; if(this.jt>0.08){ this.jt=0; this.jx=(Math.random()-0.5)*int*8; this.jy=(Math.random()-0.5)*int*8; } } else { this.jx=0; this.jy=0; this.jt=0; }
                if(this.stunTimer > 0){ this.stunTimer -= dt; return; }
                if(this.dashCooldownTimer>0)this.dashCooldownTimer-=dt;
                if(this.isDashing){
                    this.dashTimer-=dt; const sp=DASH_DISTANCE/0.12; const mx=Math.cos(this.dashAngle)*sp*dt, my=Math.sin(this.dashAngle)*sp*dt;
                    let nx=this.x+mx, ny=this.y+my; const mrg=this.w/2+2;
                    nx=Math.max(mrg,Math.min(wW-mrg,nx)); ny=Math.max(mrg,Math.min(wH-mrg,ny));
                    if(!this.collidesWithObstacles(nx,ny,obstacles)){ this.x=nx; this.y=ny; }
                    let hit=false;
                    for(const e of enemies){
                        if(!e.alive)continue;
                        const d=Math.hypot(e.x-this.x,e.y-this.y);
                        if(d<e.radius+this.w*0.8){
                            e.takeDamage(DASH_ENEMY_DAMAGE,this,particles,'dash');
                            e.stunTimer=ENEMY_STUN_DURATION;
                            const ang=Math.atan2(e.y-this.y,e.x-this.x);
                            e.x+=Math.cos(ang)*50; e.y+=Math.sin(ang)*50;
                            hit=true;
                            this.x -= Math.cos(this.dashAngle)*20;
                            this.y -= Math.sin(this.dashAngle)*20;
                            this.isDashing = false;
                            this.dashTimer = 0;
                            break;
                        }
                    }
                    if(hit){ this.hp -= DASH_SELF_DAMAGE; sfxHit(); this.isDashing = false; this.dashHitEnemy = true; return; }
                    particles.push(new Particle(this.x,this.y,this.dashAngle+Math.PI+(Math.random()-0.5),200,'#ffffff',0.15));
                    if(this.dashTimer<=0){ this.isDashing = false; if(this.dashHitEnemy){ this.hp -= DASH_SELF_DAMAGE; sfxHit(); } else { this.stunTimer = DASH_MISS_STUN; sfxShakeLeg(); } this.dashHitEnemy = false; }
                    return;
                }
                let dx=0, dy=0;
                if(!this.isShakingLeg && !this.isDashing){
                    if(keys['w']||keys['arrowup']||keys['ц'])dy-=1; if(keys['s']||keys['arrowdown']||keys['ы'])dy+=1;
                    if(keys['a']||keys['arrowleft']||keys['ф'])dx-=1; if(keys['d']||keys['arrowright']||keys['в'])dx+=1;
                    if(dx!==0&&dy!==0){ dx*=0.707; dy*=0.707; }
                    this.isMoving = (dx!==0||dy!==0);
                    if(this.isMoving){
                        this.moveAnimTimer += dt*12;
                        let nx=this.x+dx*this.speed*dt, ny=this.y+dy*this.speed*dt;
                        const mrg=this.w/2+2;
                        if(nx>mrg&&nx<wW-mrg)this.x=nx; if(ny>mrg&&ny<wH-mrg)this.y=ny;
                        if(this.collidesWithObstacles(this.x,this.y,obstacles)){ this.x-=dx*this.speed*dt; this.y-=dy*this.speed*dt; }
                    }
                } else { this.isMoving = false; }
                const wm=screenToWorld(mouseX,mouseY); let ta=Math.atan2(wm.y-this.y,wm.x-this.x);
                if(this.casingsInShoe>CASING_THRESHOLD_5&&!this.isShakingLeg){ const j=this.casingsInShoe>CASING_THRESHOLD_10?JITTER_INTENSITY_10*0.4:JITTER_INTENSITY_5*0.4; ta+=(Math.random()-0.5)*j; }
                this.angle=ta;
                if(keys['shift']&&this.dashCooldownTimer<=0&&!this.isShakingLeg&&!this.isDashing){ this.isDashing=true; this.dashTimer=0.12; this.dashAngle=this.angle; this.dashCooldownTimer=DASH_COOLDOWN; this.dashHitEnemy=false; sfxDash(); keys['shift']=false; return; }
                if(this.stickCooldown>0)this.stickCooldown-=dt;
                if(this.deagleReloading){ this.deagleReloadTimer-=dt; if(this.deagleReloadTimer<=0){ this.deagleReloading=false; this.deagleLoaded=true; } }
                if(this.isShakingLeg){ this.shakeLegTimer-=dt; if(this.shakeLegTimer<=0){ this.isShakingLeg=false; this.casingsInShoe=0; } }
                if(this.casingsInShoe>0 && !this.isShakingLeg && this.isMoving){
                    this.casingDamageTimer+=dt; let dr=1; if(this.casingsInShoe>CASING_THRESHOLD_10)dr=3; else if(this.casingsInShoe>CASING_THRESHOLD_5)dr=2;
                    while(this.casingDamageTimer>=CASING_DAMAGE_INTERVAL){ this.casingDamageTimer-=CASING_DAMAGE_INTERVAL; this.hp-=dr; if(this.hp<=0)this.hp=0; }
                } else this.casingDamageTimer=0;
                for(const f of fires){ if(Math.hypot(f.x-this.x, f.y-this.y) < f.radius+10){ this.fireDamageTimer += dt; while(this.fireDamageTimer >= FIRE_DAMAGE_INTERVAL){ this.fireDamageTimer -= FIRE_DAMAGE_INTERVAL; this.hp -= 1; if(this.hp<=0)this.hp=0; } break; } }
                if(keys['1']||(mouseWheelDelta<-30&&this.currentWeapon!=='stick')){ this.currentWeapon='stick'; mouseWheelDelta=0; keys['1']=false; }
                if(keys['2']||(mouseWheelDelta>30&&this.currentWeapon!=='deagle')){ this.currentWeapon='deagle'; mouseWheelDelta=0; keys['2']=false; }
                if(Math.abs(mouseWheelDelta)>60)mouseWheelDelta=0;
                if(mouseRightDown&&this.currentWeapon==='stick'&&this.stickCooldown<=0&&!this.isShakingLeg){ this.stickCooldown=STICK_COOLDOWN; sfxStick(); for(const e of enemies){ const d=Math.hypot(e.x-this.x,e.y-this.y); if(d<STICK_RANGE+e.radius){ e.takeDamage(STICK_DAMAGE,this,particles,'stick'); for(let i=0;i<3;i++)bloodStains.push(new BloodStain(e.x+(Math.random()-0.5)*20,e.y+(Math.random()-0.5)*20,3+Math.random()*8)); } } for(let i=0;i<6;i++)particles.push(new Particle(this.x,this.y,this.angle+(Math.random()-0.5)*1.2,150+Math.random()*200,'#8B7355',0.25)); mouseRightDown=false; }
                if(mouseLeftDown&&this.currentWeapon==='deagle'&&this.deagleLoaded&&!this.deagleReloading&&!this.isShakingLeg){ this.deagleLoaded=false; sfxShoot(); let sa=this.angle; if(this.casingsInShoe>CASING_THRESHOLD_10)sa+=(Math.random()-0.5)*0.5; else if(this.casingsInShoe>CASING_THRESHOLD_5)sa+=(Math.random()-0.5)*0.2; const bx=this.x+Math.cos(sa)*22, by=this.y+Math.sin(sa)*22; bullets.push(new Bullet(bx,by,sa,DEAGLE_DAMAGE,'player')); this.casingsInShoe++; this.x-=Math.cos(sa)*6; this.y-=Math.sin(sa)*6; for(let i=0;i<4;i++)particles.push(new Particle(bx,by,sa+Math.PI+(Math.random()-0.5)*0.6,250+Math.random()*200,'#ffaa00',0.2)); mouseLeftDown=false; }
                if(keys['r']&&this.currentWeapon==='deagle'&&!this.deagleLoaded&&!this.deagleReloading&&!this.isShakingLeg){ this.deagleReloading=true; this.deagleReloadTimer=RELOAD_TIME; sfxReload(); keys['r']=false; }
                if(keys['k']&&!this.isShakingLeg&&this.casingsInShoe>0){ this.isShakingLeg=true; this.shakeLegTimer=KEY_COOLDOWN; sfxShakeLeg(); keys['k']=false; }
                if((keys['e']||keys['g']) && this.eyes > 0){
                    this.eyes--;
                    const wx = this.x + Math.cos(this.angle)*18;
                    const wy = this.y + Math.sin(this.angle)*18;
                    thrownEyes.push(new ThrownEye(wx, wy, this.angle));
                    keys['e'] = false; keys['g'] = false;
                }
                if(this.madnessMultiplierTimer>0){ this.madnessMultiplierTimer-=dt; if(this.madnessMultiplierTimer<=0)this.madnessMultiplier=1; }

            ctx.strokeStyle='#444'; ctx.lineWidth=4; ctx.strokeRect(-camera.x,-camera.y,worldWidth,worldHeight);
            ctx.fillStyle='#111'; ctx.fillRect(-camera.x-10,-camera.y-10,worldWidth+20,10); ctx.fillRect(-camera.x-10,worldHeight-camera.y,worldWidth+20,10);
            ctx.fillRect(-camera.x-10,-camera.y,10,worldHeight); ctx.fillRect(worldWidth-camera.x,-camera.y,10,worldHeight);
        }
        function drawHUD(){
            const hpW=220,hpH=16,hx=15,hy=15;
            ctx.fillStyle='#1a0000'; ctx.fillRect(hx-2,hy-2,hpW+4,hpH+4); ctx.fillStyle='#330000'; ctx.fillRect(hx,hy,hpW,hpH);
            const pct=player.hp/player.maxHp, col=pct>0.5?'#cc0000':pct>0.25?'#ff3300':'#ff0000'; ctx.fillStyle=col; ctx.fillRect(hx,hy,hpW*pct,hpH);
            ctx.fillStyle='#fff'; ctx.font='11px monospace'; ctx.textAlign='left'; ctx.fillText(`HP: ${Math.max(0,Math.round(player.hp))}/${player.maxHp}`,hx+4,hy+12);
            const sy=hy+hpH+10; ctx.fillStyle='#ccc'; ctx.fillText(`💀 Очки: ${Math.floor(player.madnessPoints)}`, hx, sy);
            const madness = getMadnessLevel(player.madnessPoints); drawMadnessIcon(ctx, hx + 115, sy - 11, madness.level); ctx.fillStyle = '#ccc'; ctx.fillText(madness.name, hx + 135, sy);
            const mult=player.madnessMultiplier>=3?`ПСИХОТИЧЕСКИЙ x${player.madnessMultiplier.toFixed(1)}`:player.madnessMultiplier>=2?`БЕЗУМНЫЙ x${player.madnessMultiplier.toFixed(1)}`:player.madnessMultiplier>1?`ЯРОСТНЫЙ x${player.madnessMultiplier.toFixed(1)}`:'';
            if(mult){ ctx.fillStyle='#ff6600'; ctx.fillText(mult,hx,sy+16); } if(player.styleText){ ctx.fillStyle='#f00'; ctx.font='bold 14px monospace'; ctx.fillText(player.styleText,hx,sy+32); }
            const wy=sy+50; if(player.currentWeapon==='stick'){ ctx.fillStyle='#ffcc00'; ctx.fillText('🏒 КЛЮШКА [1]',hx,wy); }
            else { ctx.fillStyle='#ffaa00'; ctx.fillText(`🔫 DEAGLE [2] (${player.deagleLoaded?1:0})`,hx,wy); if(player.deagleReloading)ctx.fillText('ПЕРЕЗАРЯДКА...',hx+180,wy); }
            const cy=wy+18; ctx.fillStyle=player.casingsInShoe>5?'#f44':'#ca4'; ctx.fillText(`📀 Гильзы: ${player.casingsInShoe} [K]`,hx,cy);
            if(player.isShakingLeg){ ctx.fillStyle='#f80'; ctx.fillText('Очистка...',hx+130,cy); } const dy=cy+18; const dr=player.dashCooldownTimer<=0; ctx.fillStyle=dr?'#5f5':'#555';
            ctx.fillText(`👟 Рывок [SHIFT] ${dr?'ГОТОВ':'~'+player.dashCooldownTimer.toFixed(1)+'с'}`,hx,dy);
            const ey=dy+18; ctx.fillStyle='#ffffff'; ctx.fillText(`👁️ Глаза: ${player.eyes} [E]`,hx,ey);
            ctx.fillStyle='#ccc'; ctx.font='bold 13px monospace'; ctx.textAlign='center'; ctx.fillText(`ВОЛНА ${waveNumber}`,VIRTUAL_WIDTH/2,VIRTUAL_HEIGHT-25);
            ctx.fillText(`Врагов: ${waveEnemiesRemaining}`, VIRTUAL_WIDTH/2, VIRTUAL_HEIGHT-7);
            if(!waveActive&&currentWorld==='arena'){ ctx.fillStyle='#fc0'; ctx.fillText(`Следующая волна через ${Math.ceil(wavePauseTimer)}...`,VIRTUAL_WIDTH/2,VIRTUAL_HEIGHT-46); } ctx.textAlign='left';
        }
        player = new Player(80, CORRIDOR_HEIGHT/2); updateCanvasRect(); requestAnimationFrame(loop);
    })();
</script>
