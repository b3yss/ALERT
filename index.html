<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALERT — Браузерная 2D игра</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #c7c7c7;
            --accent: #b30000;
            --accent2: #ff1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            border: 2px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(180,0,0,0.25);
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer"><canvas id="gameCanvas"></canvas></div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const VW = 1280,
                VH = 720,
                ARENA_W = 1400,
                ARENA_H = 1000,
                CORR_W = 3900,
                CORR_H = 280;
            const PLAYER_SPD = 440,
                HP_MAX = 200,
                KEY_CD = 0.35,
                RELOAD = 0.6,
                STICK_CD = 0.2,
                STICK_R = 120,
                STICK_DMG = 70;
            const DEAGLE_DMG = 100,
                BULL_SPD = 1800,
                CASE_DMG_INT = 1.0,
                CASE_TH5 = 5,
                CASE_TH10 = 10;
            const MAD_DECAY = 10,
                MAD_RATE = 25,
                MULTI_W = 1.5,
                MULTI_BONUS = 400,
                CRIT_C = 0.4,
                CRIT_BONUS = 600;
            const WAVE_PAUSE = 3,
                BOSS_INT = 10,
                BOSS_HP_B = 150,
                BOSS_HP_S = 100;
            const DASH_D = 320,
                DASH_CD = 1,
                DASH_SELF = 10,
                DASH_ENEMY = 80;
            const STUN_DUR = 1.2,
                JITTER5 = 1.2,
                JITTER10 = 3,
                DASH_MISS_STUN = 0.3;
            const EYE_SPD = 1200,
                ORGAN_STUN = 2.0,
                ORGAN_DROP = 0.8,
                ORGAN_LIFE = 120;
            const FIRE_LIFE = 16,
                FIRE_DMG_INT = 0.5,
                TURRET_RANGE = 350;
            const CORPSE_LIFETIME = 120; // труп живёт 60 секунд
            const LOOT_CHANCE = 1.2;    // шанс найти орган в трупе

            // ДОСТИЖЕНИЯ
            const ACHIEVEMENTS = [
                { id: 'parasite', name: 'Паразит', desc: 'Хил от рая 13 волн подряд', icon: '🪽' },
                { id: 'forgot', name: 'WASTED', desc: 'Умереть первый раз', icon: '☠️' },
                { id: 'machine_no_fear', name: 'Машина не чувствует страха', desc: 'Кинуть орган в турель',
                icon: '👁️' },
                { id: 'psycho', name: 'Псих', desc: 'Собрать 40 органов за раз', icon: '🧠' },
                { id: 'pyro', name: 'Пиро', desc: 'Сжечь врага', icon: '🔥' },
                { id: 'tsunami', name: 'Цунами', desc: 'Выжить 30 волн', icon: '🌊' },
                { id: 'deagle_master', name: 'ИИИИХХАААААВ!', desc: '100 килов диглом', icon: '💥' },
                { id: 'stick_champ', name: 'We r the champions!', desc: '50 килов клюшкой', icon: '🏒' },
                { id: 'collector', name: 'Коллекционер', desc: 'Накопить 30 органов', icon: '🎒' },
                { id: 'wave10', name: 'Ветеран', desc: 'Дойти до 10 волны', icon: '🌊' }
            ];
            let unlockedAch = {};
            try { const saved = localStorage.getItem('alert_ach'); if (saved) unlockedAch = JSON.parse(saved); } catch (
                e) {}

            function unlockAch(id) { if (unlockedAch[id]) return; const ach = ACHIEVEMENTS.find(a => a.id ===
                id); if (!ach) return;
            unlockedAch[id] = true;
            localStorage.setItem('alert_ach', JSON.stringify(unlockedAch));
            addNotification(ach.name, ach.icon); }
            let notifications = [];

            function addNotification(text, icon) { notifications.push({ text, icon, timer: 3.0, y: -60,
            alpha: 1 }); }

            function madnessLevel(s) { if (s < 15000) return { n: 'Садист', l: 0 }; if (s < 40000) return { n: 'Хитман',
                    l: 1 }; if (s < 100000) return { n: 'Киллер', l: 2 }; return { n: 'АБСОЛЬТНЫЙ МОНСТР', l: 3 }; }

            let adState = null,
                lastMad = 0;
            const adUp = new Image();
            adUp.src = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOTLcskIJU1IbFHPE7zHU24h580TrHyVXqFQ&s';
            const adDown = new Image();
            adDown.src = 'https://i.pinimg.com/originals/a9/e8/37/a9e837bbe66e316a8d325bb4e15718e3.gif';

            function ad(type) { adState = { type, timer: 0, img: type === 'up' ? adUp : adDown, x: -400, y: VH -
                    200, alpha: 0, dur: 6 }; }

            let audioCtx = null;

            function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); if (
                    audioCtx.state === 'suspended') audioCtx.resume(); }

            function bip(f, d, t = 'square', v = 0.08, fo = true) { if (!audioCtx) return; try { let o = audioCtx
                    .createOscillator(),
                    g = audioCtx.createGain();
                o.type = t;
                o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(v, audioCtx.currentTime); if (fo) g.gain.exponentialRampToValueAtTime(0.001,
                    audioCtx.currentTime + d);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + d); } catch (e) {} }

            function shootSnd() { bip(80, 0.1);
                bip(40, 0.15, 'sawtooth', 0.1) }

            function reloadSnd() { bip(200, 0.08, 'triangle', 0.06);
                bip(150, 0.12, 'square', 0.05) }

            function stickSnd() { bip(300, 0.15, 'sine', 0.07);
                bip(100, 0.1, 'triangle', 0.04) }

            function brutalStickSnd() { bip(200, 0.2, 'sawtooth', 0.2);
                bip(80, 0.3, 'square', 0.15) } // новый звук жёсткого удара

            function deathSnd() { bip(60, 0.2, 'sawtooth', 0.1);
                bip(30, 0.3, 'square', 0.08) }

            function shakeSnd() { bip(120, 0.3, 'triangle', 0.05);
                bip(90, 0.4, 'sine', 0.04) }

            function hitSnd() { bip(50, 0.08, 'square', 0.12) }

            function bossSnd() { bip(40, 0.5, 'sawtooth', 0.15);
                bip(25, 0.6, 'square', 0.12) }

            function dashSnd() { bip(70, 0.25, 'sawtooth', 0.2);
                bip(30, 0.3, 'square', 0.15) }

            function angelSnd() { bip(523, 0.3, 'sine', 0.1);
                bip(659, 0.4, 'sine', 0.1);
                bip(784, 0.5, 'sine', 0.12);
                bip(1047, 0.6, 'sine', 0.1) }

            function explSnd() { bip(40, 0.4, 'sawtooth', 0.3);
                bip(20, 0.6, 'square', 0.25) }

            function burnSnd() { bip(200, 0.2, 'sawtooth', 0.1);
                bip(150, 0.3, 'square', 0.08) }
            function bossAppearSnd() { const now = audioCtx.currentTime;
                bip(65, 0.8, 'sawtooth', 0.2);
                bip(55, 1.0, 'square', 0.15);
                bip(82, 0.6, 'triangle', 0.1);
                bip(110, 0.7, 'sine', 0.08); }

            const STATE = { MENU: 'menu', HOWTO: 'howto', CORR: 'corridor', PLAY: 'playing', DEAD: 'dead',
                ACH: 'achievements' };
            let state = STATE.MENU,
                paused = false,
                layoutW = 0,
                diff = 'medium';
            let diffSet = { easy: { hpM: 0.7, spM: 0.8, spawnM: 0.6, waveA: 0.7 }, medium: { hpM: 1.0, spM: 1.0,
                    spawnM: 1.0, waveA: 1.0 }, hard: { hpM: 1.4, spM: 1.25, spawnM: 1.4, waveA: 1.3 },
                insane: { hpM: 2.0, spM: 1.6, spawnM: 2.0, waveA: 1.7 } };
            let hiScore = { easy: { s: 0, w: 0 }, medium: { s: 0, w: 0 }, hard: { s: 0, w: 0 }, insane: { s: 0,
                w: 0 } };
            try { let s = localStorage.getItem('alert_hi'); if (s) { let p = JSON.parse(s); for (let k of Object.keys(
                        hiScore)) if (p[k]) hiScore[k] = p[k]; } } catch (e) {}

            const keys = {};
            let mx = VW / 2,
                my = VH / 2,
                mc = false;
            let ml = false,
                mr = false,
                mwDelta = 0;
            let canvasRect = null;

            function updateRect() { canvasRect = canvas.getBoundingClientRect(); }

            function getMouse(e) { if (!canvasRect) updateRect();
            let sx = VW / canvasRect.width,
                sy = VH / canvasRect.height; return { x: (e.clientX - canvasRect.left) * sx, y: (e.clientY - canvasRect
                        .top) * sy }; }
            document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;
                keys[e.code] = true; if (e.key === 'Escape') { if (state === STATE.PLAY || state === STATE.CORR)
                    paused = !paused;
                e.preventDefault(); } if (['k', 'r', '1', '2', 'shift', 'e', 'g', 'q', 'u'].includes(e.key.toLowerCase()) ||
                    e.key === 'Shift') e.preventDefault(); if (/[а-яё]/i.test(e.key)) layoutW = 2.5; });
            document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false;
                keys[e.code] = false; });
            canvas.addEventListener('mousemove', e => { let m = getMouse(e);
                mx = m.x;
                my = m.y;
                mc = true; });
            canvas.addEventListener('mouseleave', () => mc = false);
            canvas.addEventListener('mousedown', e => { initAudio(); if (e.button === 0) ml = true; if (e.button ===
                    2) mr = true;
                e.preventDefault(); });
            canvas.addEventListener('mouseup', e => { if (e.button === 0) ml = false; if (e.button === 2) mr =
                false; });
            canvas.addEventListener('wheel', e => { mwDelta += e.deltaY;
                e.preventDefault(); });
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('resize', () => { resize();
                updateRect(); });

            function resize() { let mW = innerWidth,
                    mH = innerHeight,
                    r = VW / VH;
                let w, h; if (mW / mH > r) { h = mH;
                    w = h * r; } else { w = mW;
                    h = w / r; }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                canvas.width = VW;
                canvas.height = VH;
                updateRect(); }
            resize();

            let cam = { x: 0, y: 0, tx: 0, ty: 0 },
                healFlash = 0,
                redScreen = 0;
            let bossAppearTimer = 0;
            let secretShown = false; // для секретной фразы

            function upCam(px, py, wW, wH, dt) { cam.tx = px - VW / 2;
                cam.ty = py - VH / 2;
                cam.tx = Math.max(0, Math.min(cam.tx, wW - VW));
                cam.ty = Math.max(0, Math.min(cam.ty, wH - VH)); if (wW <= VW) cam.tx = (wW - VW) / 2; if (wH <=
                    VH) cam.ty = (wH - VH) / 2; let lerp = 8;
                cam.x += (cam.tx - cam.x) * Math.min(1, lerp * dt);
                cam.y += (cam.ty - cam.y) * Math.min(1, lerp * dt); }

            function toWorld(sx, sy) { return { x: sx + cam.x, y: sy + cam.y }; }

            class Fire { constructor(x, y) { this.x = x;
                    this.y = y;
                    this.r = 20 + Math.random() * 10;
                    this.life = FIRE_LIFE; } up(dt) { this.life -= dt; return this.life > 0; } draw(ctx, cx, cy) { let a =
                        Math.min(1, this.life / 2);
                    ctx.globalAlpha = a * 0.8;
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.ellipse(this.x - cx, this.y - cy, this.r * 0.8, this.r, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.ellipse(this.x - cx, this.y - cy - 2, this.r * 0.5, this.r * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1; } }
            class Blood { constructor(x, y, r) { this.x = x;
                    this.y = y;
                    this.r = r || 5 + Math.random() * 12;
                    this.a = 0.7 + Math.random() * 0.3;
                    this.life = 15 + Math.random() * 20;
                    this.max = this.life; } up(dt) { this.life -= dt; return this.life > 0; } draw(ctx, cx, cy) { let a =
                        Math.max(0, this.life / this.max) * this.a;
                    ctx.fillStyle = `rgba(120,0,0,${a})`;
                    ctx.beginPath();
                    ctx.arc(this.x - cx, this.y - cy, this.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = `rgba(60,0,0,${a*0.8})`;
                    ctx.beginPath();
                    ctx.arc(this.x - cx + 1, this.y - cy - 1, this.r * 0.7, 0, Math.PI * 2);
                    ctx.fill(); } }
            class Organ { constructor(x, y, t) { this.x = x;
                    this.y = y;
                    this.type = t;
                    this.r = t === 'brain' ? 6 : t === 'skull' ? 7 : t === 'guts' ? 5 : 4;
                    this.life = ORGAN_LIFE;
                    this.color = t === 'brain' ? '#ff8888' : t === 'skull' ? '#ddd' : t === 'guts' ? '#cc5555' : t ===
                        'trachea' ? '#ffaaaa' : '#ffffff'; } up(dt) { this.life -= dt; return this.life > 0; } draw(ctx,
                    cx, cy) { if (this.life <= 0) return; let a = Math.min(1, this.life / 5);
                    ctx.globalAlpha = a; if (this.type === 'brain') { ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.ellipse(this.x - cx, this.y - cy, this.r, this.r * 0.9, 0, 0, Math.PI * 2);
                        ctx.fill(); } else if (this.type === 'skull') { ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x - cx, this.y - cy, this.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(this.x - cx - 2, this.y - cy - 2, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(this.x - cx + 2, this.y - cy - 2, 2, 0, Math.PI * 2);
                        ctx.fill(); } else if (this.type === 'guts') { ctx.strokeStyle = this.color;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(this.x - cx - 3, this.y - cy);
                        ctx.quadraticCurveTo(this.x - cx, this.y - cy - 5, this.x - cx + 3, this.y - cy);
                        ctx.stroke(); } else if (this.type === 'trachea') { ctx.fillStyle = this.color;
                        ctx.fillRect(this.x - cx - 4, this.y - cy - 2, 8, 4);
                        ctx.strokeStyle = '#cc7777';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(this.x - cx - 4, this.y - cy);
                        ctx.lineTo(this.x - cx + 4, this.y - cy);
                        ctx.stroke(); } else { ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(this.x - cx, this.y - cy, this.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(this.x - cx, this.y - cy, this.r - 3, 0, Math.PI * 2);
                        ctx.fill(); }
                    ctx.globalAlpha = 1; } }
            class ThrownOrgan { constructor(x, y, angle, type) { this.x = x;
                    this.y = y;
                    this.angle = angle;
                    this.speed = type === 'eye' ? EYE_SPD : type === 'skull' ? 900 : type === 'brain' ? 1000 :
                    1100;
                    this.r = 4;
                    this.alive = true;
                    this.type = type; } up(dt, wW, wH) { this.x += Math.cos(this.angle) * this.speed * dt;
                    this.y += Math.sin(this.angle) * this.speed * dt; if (this.x < -50 || this.x > wW + 50 || this
                        .y < -50 || this.y > wH + 50) this.alive = false; } draw(ctx, cx, cy) { if (!this.alive)
                        return; let sx = this.x - cx,
                        sy = this.y - cy;
                    ctx.fillStyle = this.type === 'eye' ? '#fff' : this.type === 'skull' ? '#ddd' : '#cc5555';
                    ctx.beginPath();
                    ctx.arc(sx, sy, this.r, 0, Math.PI * 2);
                    ctx.fill(); if (this.type === 'eye') { ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(sx, sy, this.r - 3, 0, Math.PI * 2);
                        ctx.fill(); } } }
            // Новый класс: брошенный объект (декор или труп)
            class ThrownObject { constructor(x, y, angle, type, damage) { this.x = x;
                    this.y = y;
                    this.angle = angle;
                    this.speed = 600;
                    this.r = 8;
                    this.alive = true;
                    this.type = type; // 'box' или 'corpse'
                    this.damage = damage || 40; } up(dt, wW, wH) { this.x += Math.cos(this.angle) * this.speed * dt;
                    this.y += Math.sin(this.angle) * this.speed * dt; if (this.x < -50 || this.x > wW + 50 || this
                        .y < -50 || this.y > wH + 50) this.alive = false; } draw(ctx, cx, cy) { if (!this.alive)
                        return; ctx.fillStyle = this.type === 'corpse' ? '#5a3a3a' : '#8B7355';
                    ctx.fillRect(this.x - cx - 6, this.y - cy - 6, 12, 12);
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(this.x - cx - 6, this.y - cy - 6, 12, 12); } }
            // Новый класс: труп врага
            class Corpse { constructor(x, y, enemyType) { this.x = x;
                    this.y = y;
                    this.type = enemyType;
                    this.life = CORPSE_LIFETIME;
                    this.looted = false;
                    this.r = enemyType === 'saw' ? 14 : enemyType === 'pistol' ? 13 : 18; } up(dt) { this.life -= dt; return this
                        .life > 0; } draw(ctx, cx, cy) { let sx = this.x - cx,
                        sy = this.y - cy;
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.globalAlpha = Math.min(1, this.life / 5);
                    ctx.fillStyle = '#5a3a3a';
                    ctx.fillRect(-8, -4, 16, 12);
                    ctx.fillStyle = '#3a2a2a';
                    ctx.fillRect(-6, 8, 4, 8);
                    ctx.fillRect(2, 8, 4, 8);
                    ctx.fillStyle = '#7a5a5a';
                    ctx.beginPath();
                    ctx.arc(0, -10, 7, 0, Math.PI * 2);
                    ctx.fill();
                    // глаза Х
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-5, -12);
                    ctx.lineTo(-1, -8);
                    ctx.moveTo(-1, -12);
                    ctx.lineTo(-5, -8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(1, -12);
                    ctx.lineTo(5, -8);
                    ctx.moveTo(5, -12);
                    ctx.lineTo(1, -8);
                    ctx.stroke();
                    // кровь
                    ctx.fillStyle = '#600';
                    ctx.beginPath();
                    ctx.arc(-3, 5, 4, 0, Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(4, 7, 3, 0, Math.PI);
                    ctx.fill();
                    ctx.restore(); } }

            class Player {
                constructor(x, y) { this.x = x;
                    this.y = y;
                    this.w = 28;
                    this.h = 32;
                    this.hp = HP_MAX;
                    this.maxHp = HP_MAX;
                    this.spd = PLAYER_SPD;
                    this.angle = 0;
                    this.weapon = 'stick';
                    this.stickCd = 0;
                    this.deagleLoaded = true;
                    this.deagleReload = false;
                    this.deagleReloadT = 0;
                    this.casings = 0;
                    this.casingT = 0;
                    this.shaking = false;
                    this.shakeT = 0;
                    this.madPts = 0;
                    this.madMult = 1;
                    this.madMultT = 0;
                    this.killsW = 0;
                    this.multiKT = 0;
                    this.noDmgT = 0;
                    this.styleTxt = '';
                    this.styleT = 0;
                    this.dashCd = 0;
                    this.isDash = false;
                    this.dashT = 0;
                    this.dashAngle = 0;
                    this.jx = 0;
                    this.jy = 0;
                    this.jt = 0;
                    this.stunT = 0;
                    this.dashHit = false;
                    this.organs = 0;
                    this.isMov = false;
                    this.moveAnim = 0;
                    this.fireT = 0;
                    this.killCount = 0;
                    this.maxMad = 0;
                    this.angelHealStreak = 0;
                    this.diedByCasings = false;
                    this.threwOrganAtTurret = false;
                    this.burnedEnemy = false;
                    this.maxOrgansEver = 0;
                    this.deagleKills = 0;
                    this.stickKills = 0;
                    this.holdingObject = null; // { type: 'box'|'corpse', obj: ссылка на объект? } для декора/трупа
                }
                reset(x, y) { this.x = x;
                    this.y = y;
                    this.hp = this.maxHp;
                    this.angle = 0;
                    this.weapon = 'stick';
                    this.stickCd = 0;
                    this.deagleLoaded = true;
                    this.deagleReload = false;
                    this.deagleReloadT = 0;
                    this.casings = 0;
                    this.casingT = 0;
                    this.shaking = false;
                    this.shakeT = 0;
                    this.madPts = 0;
                    this.madMult = 1;
                    this.madMultT = 0;
                    this.killsW = 0;
                    this.multiKT = 0;
                    this.noDmgT = 0;
                    this.styleTxt = '';
                    this.styleT = 0;
                    this.dashCd = 0;
                    this.isDash = false;
                    this.dashT = 0;
                    this.jx = 0;
                    this.jy = 0;
                    this.jt = 0;
                    this.stunT = 0;
                    this.dashHit = false;
                    this.organs = 0;
                    this.isMov = false;
                    this.moveAnim = 0;
                    this.fireT = 0;
                    this.killCount = 0;
                    this.maxMad = 0;
                    this.angelHealStreak = 0;
                    this.diedByCasings = false;
                    this.threwOrganAtTurret = false;
                    this.burnedEnemy = false;
                    this.maxOrgansEver = 0;
                    this.deagleKills = 0;
                    this.stickKills = 0;

                        bullets) b.draw(ctx, cam.x, cam.y); for (let p of parts) p.draw(ctx, cam.x, cam.y);
                    deathBtns = drawDeath(); } if (adState) { ctx.save();
                    ctx.globalAlpha = adState.alpha; let px = adState.x,
                        py = adState.y;
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(px + 5, py + 5, 320, 180);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(px, py, 320, 180);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, 320, 180); if (adState.img && adState.img.complete) ctx.drawImage(adState
                        .img, px + 10, py + 10, 140, 140);
                    ctx.fillStyle = '#ff0';
                    ctx.font = 'bold 16px monospace'; let text = adState.type === 'up' ?
                        'Вауу, маладес скибиди сигма, продолжай в том же духе, да' :
                        'я знаю где живут твои родители'; let words = text.split(' '),
                        line = '',
                        yOff = py + 30; for (let w of words) { let test = line + w + ' '; if (ctx.measureText(test)
                            .width > 150 && line !== '') { ctx.fillText(line, px + 160, yOff);
                            yOff += 24;
                            line = w + ' '; } else line = test; }
                    ctx.fillText(line, px + 160, yOff);
                    ctx.restore(); } for (let n of notifications) { ctx.save();
                    ctx.globalAlpha = n.alpha; let nx = VW - 320,
                        ny = n.y;
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(nx, ny, 300, 50);
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px monospace';
                    ctx.fillText(`${n.icon} ${n.text}`, nx + 10, ny + 35);
                    ctx.restore(); }
                ctx.save();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mx, my, 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#f00';
                ctx.beginPath();
                ctx.arc(mx, my, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ml = false;
                mr = false;
            }
            player = new Player(80, CORR_H / 2);
            updateRect();
            requestAnimationFrame(loop);
        })();
    </script>
